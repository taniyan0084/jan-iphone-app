<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>にゃんSearch Dropbox直接取得検証</title><style>body{font-family:system-ui,'Meiryo',sans-serif;max-width:850px;margin:30px auto;padding:0 18px;color:#202b36}button{font-size:17px;background:#155c99;color:white;border:0;border-radius:7px;padding:14px 20px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4f7;border-radius:8px;padding:16px;line-height:1.6}.note{color:#555}h1{font-size:24px}</style></head><body><h1>にゃんSearch Dropbox直接取得テスト Ver.2</h1><p>DropboxだけでJSONを自動更新できるかを検証します。<b>既存アプリ・Dropboxのファイルは変更しません。</b></p><p class="note">約48MBのJSONを最大3回ダウンロードする可能性があります。Wi-Fi環境で実行してください。</p><button id="go">3種類のURLを順番にテスト</button><pre id="log">待機中</pre><script>
const BASE='https://www.dropbox.com/scl/fi/u7ihjmhmi191k7m4nz3ab/20261026_JSON.json?rlkey=swqoxi6qa2ususyedqvd314p1';
const candidates=[['① Dropboxusercontent直接取得（最優先）','https://dl.dropboxusercontent.com/scl/fi/u7ihjmhmi191k7m4nz3ab/20261026_JSON.json?rlkey=swqoxi6qa2ususyedqvd314p1&dl=0'],['② Dropbox raw=1',BASE+'&raw=1'],['③ Dropbox dl=1',BASE+'&dl=1']];
const log=document.getElementById('log');let lines=[];function write(s){lines.push(s);log.textContent=lines.join('\n');}function stamp(){return new Date().toLocaleString('ja-JP')}
async function test(label,url){write('\n'+label+' 開始: '+stamp());const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),90000);try{const res=await fetch(url,{mode:'cors',credentials:'omit',cache:'no-store',signal:ctrl.signal});write('HTTP: '+res.status+' '+res.statusText);write('最終URLドメイン: '+new URL(res.url).hostname);write('Content-Type: '+res.headers.get('content-type'));write('Content-Length: '+res.headers.get('content-length'));if(!res.ok)throw Error('HTTP '+res.status);const content=await res.text();write('受信文字数: '+content.length.toLocaleString());let obj=JSON.parse(content);if(!Array.isArray(obj))throw Error('JSONが配列ではありません');write('商品件数: '+obj.length.toLocaleString());write('最初のJAN: '+(obj[0]&&obj[0][1]));if(obj.length<300000)throw Error('想定件数より少ない');write('★ 成功: fetch＋JSON解析とも正常');return true}catch(e){write('失敗: '+e.name+': '+e.message);return false}finally{clearTimeout(timer)}}
document.getElementById('go').onclick=async()=>{document.getElementById('go').disabled=true;lines=[];write('テスト開始: '+stamp());write('実行元: '+location.origin);write('ブラウザ: '+navigator.userAgent);let success=false;for(const [label,url] of candidates){if(await test(label,url)){success=true;break}}write('\n========================');write(success?'判定: Dropbox直接取得の成功を確認。次はGitHub Pagesの実際のアプリ上で最終検証。':'判定: 3方式とも失敗。CORS・共有権限・ネットワーク等の切り分けが必要。');write('========================');document.getElementById('go').disabled=false};
</script></body></html>
